<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>UML Visual Grader - Student Edition</title>
	<style>
		:root {
			--bg-base: #f8fafc;
			/* Morning Sky */
			--bg-card: #ffffff;
			--accent: #720f32;
			/* Berry Wine */
			--accent-hover: #9c1545;
			--accent-soft: #114665;
			/* Ocean Noir */
			--text-main: #16202b;
			/* Indigo Night */
			--text-dim: #7b445a;
			/* Muted Mauve */
			--glass-border: rgba(22, 32, 43, 0.08);
			--card-radius: 16px;
			--shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.05);
			--shadow-medium: 0 10px 30px rgba(0, 0, 0, 0.08);
			--shadow-glow: 0 0 15px rgba(114, 15, 50, 0.15);
		}

		* {
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', -apple-system, sans-serif;
			background: var(--bg-base);
			color: var(--text-main);
			margin: 0;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}

		header {
			padding: 28px 40px;
			background: rgba(255, 255, 255, 0.85);
			backdrop-filter: blur(25px);
			border-bottom: 1px solid var(--glass-border);
			box-shadow: var(--shadow-soft);
			z-index: 100;
		}

		.brand {
			font-size: 1.5rem;
			font-weight: 700;
			letter-spacing: -0.025em;
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.brand span {
			color: var(--accent);
		}

		.controls {
			display: grid;
			grid-template-columns: 1fr 1fr auto auto;
			gap: 16px;
			align-items: center;
		}

		.input-card {
			background: var(--bg-card);
			border: 1px solid var(--glass-border);
			padding: 12px 20px;
			border-radius: var(--card-radius);
			display: flex;
			align-items: center;
			justify-content: space-between;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			cursor: pointer;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
		}

		.input-card:hover {
			border-color: var(--accent-soft);
			transform: translateY(-2px);
			box-shadow: var(--shadow-medium);
		}

		.input-card.selected {
			border-color: var(--accent-soft);
			background: rgba(17, 70, 101, 0.05);
			box-shadow: 0 0 15px rgba(17, 70, 101, 0.15);
		}

		.input-info {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.input-label {
			font-size: 0.75rem;
			font-weight: 600;
			text-transform: uppercase;
			color: var(--text-dim);
		}

		.file-name {
			font-size: 0.875rem;
			color: var(--text-main);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			max-width: 180px;
		}

		button {
			font-family: inherit;
			font-weight: 600;
			font-size: 0.875rem;
			padding: 12px 24px;
			border-radius: var(--card-radius);
			border: none;
			cursor: pointer;
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.btn-primary {
			background: linear-gradient(135deg, var(--accent) 0%, #4d0a22 100%);
			color: white;
			box-shadow: 0 4px 15px rgba(114, 15, 50, 0.25);
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.btn-primary:hover {
			background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent) 100%);
			transform: translateY(-2px) scale(1.02);
			box-shadow: 0 10px 20px rgba(114, 15, 50, 0.35);
		}

		.btn-primary:active {
			transform: translateY(0) scale(1);
		}

		.btn-primary:disabled {
			background: #cbd5e1;
			transform: none;
			box-shadow: none;
			cursor: not-allowed;
			opacity: 0.7;
		}

		.btn-success {
			background: var(--bg-card);
			color: var(--accent-soft);
			border: 1px solid var(--accent-soft);
		}

		.btn-success:hover {
			background: var(--accent-soft);
			color: white;
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(17, 70, 101, 0.2);
		}

		main {
			flex: 1;
			position: relative;
			background: var(--bg-base);
			overflow: hidden;
		}

		#results {
			width: 100%;
			height: 100%;
			border: none;
			opacity: 0;
			transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
			background: var(--bg-base);
		}

		#results.ready {
			opacity: 1;
		}

		.status-dot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: #e2e8f0;
			border: 2px solid rgba(0, 0, 0, 0.05);
			transition: all 0.3s ease;
		}

		.selected .status-dot {
			background: var(--accent-soft);
			box-shadow: 0 0 12px var(--accent-soft);
			border-color: rgba(17, 70, 101, 0.2);
		}

		/* Spinner */
		.overlay {
			position: absolute;
			inset: 0;
			background: rgba(248, 250, 252, 0.9);
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 200;
			gap: 20px;
			animation: fadeIn 0.3s ease;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 4px solid rgba(114, 15, 50, 0.1);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
			}

			to {
				opacity: 1;
			}
		}
	</style>
</head>

<body>
	<div class="overlay" id="loading">
		<div class="spinner"></div>
		<p style="font-weight: 700; color: var(--accent); letter-spacing: 0.05em;">ANALYSTING UML...</p>
	</div>

	<header>
		<div class="brand">
			<span>UML</span> Visual Grader
			<div id="ai-badge"
				style="display: inline-block; font-size: 0.65rem; padding: 4px 8px; border-radius: 20px; background: #94a3b8; color: white; margin-left: 10px; letter-spacing: 0.05em; font-weight: 800; vertical-align: middle;">
				AI OFF</div>
		</div>
		<div class="controls">
			<div class="input-card" id="cardSol" onclick="goChooseSol()">
				<div class="input-info">
					<span class="input-label">Solution</span>
					<span class="file-name" id="solLabel">Select .drawio file</span>
				</div>
				<div class="status-dot"></div>
			</div>

			<div class="input-card" id="cardStu" onclick="goChooseStu()">
				<div class="input-info">
					<span class="input-label">Assignment</span>
					<span class="file-name" id="stuLabel">Select .drawio file</span>
				</div>
				<div class="status-dot"></div>
			</div>

			<button class="btn-primary" id="btnSubmit" onclick="goSubmit()">
				RUN ANALYSIS
			</button>

			<button class="btn-success" id="btnExport" disabled onclick="goExport()">
				SAVE HTML
			</button>
		</div>
	</header>

	<main>
		<iframe id="results"></iframe>
	</main>

	<script>
		function setFile(type, name) {
			const label = document.getElementById(type + "Label");
			const card = document.getElementById("card" + (type.charAt(0).toUpperCase() + type.slice(1)));
			label.innerText = name;
			card.classList.add("selected");
		}

		function renderReport(b64) {
			const bin = atob(b64);
			const blob = new Blob([bin], { type: 'text/html' });
			const url = URL.createObjectURL(blob);
			const iframe = document.getElementById("results");

			// Remove previous ready class to allow new transition
			iframe.classList.remove("ready");

			iframe.onload = () => {
				iframe.classList.add("ready");
				URL.revokeObjectURL(url);
			};

			iframe.src = url;
			document.getElementById("loading").style.display = "none";
		}

		function showAIStatus(available) {
			const badge = document.getElementById("ai-badge");
			if (available) {
				badge.innerText = "AI ON";
				badge.style.background = "var(--accent-soft)"; // Green
			} else {
				badge.innerText = "AI OFF";
				badge.style.background = "var(--accent)"; // Red
			}
		}
	</script>
</body>

</html>
